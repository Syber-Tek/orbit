org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false
android.useAndroidX=true
# Works around the Windows cross-drive Kotlin incremental compile crash
# (pub cache on C:, project on D:). Slow, but reliable.
kotlin.incremental=false
# The Shorebird SDK lives under a path with spaces on this machine, which makes
# the out-of-process Kotlin daemon fail to connect. Compiling in-process avoids
# the daemon entirely.
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
